<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driveshot</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1 class="page__title">Driveshot</h1>
        <p class="page__subtitle" id="subtitle"></p>
      </header>

      <section class="card" aria-labelledby="destination-heading">
        <h2 class="card__title" id="destination-heading"></h2>
        <p class="card__note" id="destination-note"></p>
        <ul class="providers" id="providers"></ul>
      </section>

      <section class="card" aria-labelledby="hotkey-heading">
        <h2 class="card__title" id="hotkey-heading"></h2>
        <p class="card__note" id="hotkey-note"></p>
        <p class="result" id="hotkey" role="status"></p>
      </section>

      <section class="card" aria-labelledby="last-shot-heading">
        <h2 class="card__title" id="last-shot-heading"></h2>
        <p class="result result--first" id="last-shot" role="status"></p>
      </section>

      <section class="card" aria-labelledby="retention-heading">
        <h2 class="card__title" id="retention-heading"></h2>
        <p class="card__note" id="retention-note"></p>
        <div class="field">
          <label class="field__label" for="retention" id="retention-label"></label>
          <select class="field__control" id="retention"></select>
        </div>
        <p class="result" id="expiry" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
