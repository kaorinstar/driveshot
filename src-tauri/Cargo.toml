# The application: the tray icon, the hotkey, the capture, the cloud calls, and the settings
# window. Anything here that turns out not to need a screen, a file or a network belongs in
# driveshot-core instead, where it can be tested on any platform.
#
# The version below is the single place a release number is written. The Tauri bundler reads it
# from here when tauri.conf.json does not name one, and tauri.conf.json deliberately does not.
# .github/workflows/release.yml rewrites this one line from the tag it was started by.

[package]
name = "driveshot"
version = "0.1.0"
description = "Capture part of the screen, upload it to your own cloud drive, share the link, and delete it when it expires"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The application is distributed as an installer, not as a crate.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
driveshot-core = { path = "../crates/driveshot-core" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# tray-icon is what puts Driveshot in the notification area. It is a feature rather than the
# default because an application that only shows a window does not need it, and it pulls in a
# system library on Linux.
#
# macos-private-api is what allows a transparent window on macOS, and the capture overlay is one:
# it dims the screen and leaves a hole where the selection is. Without this feature the builder's
# .transparent() does not exist on macOS at all, and the build fails there (it compiled on Linux
# and Windows, where the method is unconditional - #17).
#
# The cost is real and worth stating: an application built with it uses private Apple API and
# cannot be sold through the App Store. Driveshot is distributed as a disk image from its own
# releases page, so nothing it plans to do is lost. Reversing this decision means finding another
# way to draw the overlay - showing a captured image in an opaque window rather than dimming a
# transparent one - not simply removing the flag. #18 has that design written out, with what it
# would cost, for whenever the App Store becomes a reason.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
xcap = "0.9.8"
dirs = "7.0.0"
